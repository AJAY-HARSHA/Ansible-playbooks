---
- name: create an empty folder and download jenkins.war into it
  hosts: all
  tasks:
    - name: create folder
      file:
        name: /tmp/myfolder
        state: directory
    - name: Download the jenkins.war
      get_url:
        url: https://get.jenkins.io/war-stable/2.568.1/jenkins.war
        dest: /tmp/myfolder
...
