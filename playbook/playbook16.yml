---
- name: implementing loops
  hosts: all
  tasks:
    - name: install or uninstall or upgrade s/w apps
      apt:
        name: "{{item.a}}"
        state: "{{item.b}}"
        update_cache: "{{item.c}}"
      loop:
        - { a: tree,b: present,c: no}
        - { a: git,b: absent,c: no}
        - { a: maven,b: latest,c: yes}
...

